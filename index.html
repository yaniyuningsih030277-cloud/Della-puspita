body {

/* =========================
   BACKGROUND DECORATION
========================= */

.bg-heart {
    position: fixed;
    font-size: 22px;
    opacity: .12;
    pointer-events: none;
    animation: float 6s infinite ease-in-out;
}

.heart1 { top: 15%; left: 5%; }
.heart2 { top: 50%; right: 5%; animation-delay: 2s; }
.heart3 { bottom: 15%; left: 10%; animation-delay: 4s; }

@keyframes float {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-25px) rotate(10deg); }
}

/* =========================

========================= */

nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 18px 8%;

    background: rgba(255,255,255,.85);
    backdrop-filter: blur(15px);

    border-bottom: 1px solid rgba(193,18,31,.1);
}

.logo {
    font-family: "Playfair Display", serif;
    font-size: 25px;
    font-weight: 700;
    color: var(--red);
}

.logo span {
    color: #222;

.nav-links {
    display: flex;
    gap: 28px;

}

.nav-links a {
    text-decoration: none;
    color: #333;
    font-size: 14px;
    transition: .3s;
}

.nav-links a:hover {
    color: var(--red);
}

.menu-btn {
    display: none;
    font-size: 25px;
    cursor: pointer;
}

   HERO
========================= */

.hero {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 120px 8% 70px;

    background:
        radial-gradient(circle at 10% 20%, #ffdce2, transparent 30%),
        radial-gradient(circle at 90% 80%, #ffe5e9, transparent 30%),
        #fff8f9;
}

.hero-container {
    max-width: 1100px;
    width: 100%;

    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    gap: 70px;
}

/* PROFILE PHOTO FRAME */

.photo-wrapper {
    display: flex;
    justify-content: center;
    position: relative;
}

.photo-frame {
    width: 310px;
    height: 380px;

    border: 12px solid white;
    border-radius: 35px;

    background: linear-gradient(135deg, var(--red), #ff758f);

    padding: 8px;

    box-shadow:
        0 25px 60px rgba(193,18,31,.25);

    transform: rotate(-3deg);
    transition: .5s;
}

.photo-frame:hover {
    transform: rotate(0deg) scale(1.03);
}

.photo-frame img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    border-radius: 20px;

    background: #eee;
}

/* small decoration */

.photo-wrapper::before {
    content: "♡";
    position: absolute;

    top: -30px;
    right: 40px;

    width: 55px;
    height: 55px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: var(--red);
    color: white;

    font-size: 28px;

    box-shadow: 0 10px 30px rgba(193,18,31,.3);
}

.hero-text small {
    color: var(--red);
    font-weight: 600;
    letter-spacing: 3px;
}

.hero-text h1 {
    font-family: "Playfair Display", serif;

    font-size: clamp(50px, 7vw, 85px);
    line-height: 1;

    margin: 15px 0;
}

.hero-text h1 span {
    color: var(--red);
}

.hero-text p {
    color: var(--gray);
    line-height: 1.8;
    max-width: 500px;
}

.btn {
    display: inline-block;

    margin-top: 30px;

    padding: 14px 28px;

    border-radius: 30px;

    background: var(--red);
    color: white;

    text-decoration: none;

    font-weight: 600;

    transition: .3s;

    box-shadow: 0 10px 25px rgba(193,18,31,.25);
}

.btn:hover {
    transform: translateY(-4px);
    background: var(--dark-red);
}
